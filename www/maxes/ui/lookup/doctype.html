<div id='lookupentry'>

    <div style='display:flex; gap:20px; align-items:stretch;'>

        <!-- LEFT COLUMN -->
        <div style='width:50%;'>
            <table style='width:100%; border-collapse:collapse;'>
                <tr>
                    <td style='width:30%;'>Doc. Num</td>
                    <td>
                        <input type='text'
                            class='nonpersistent'
                            data-attribute='doctypenum'
                            data-type='upper'
                            data-key='value'
                            data-input='required'>
                    </td>
                </tr>

                <tr>
                    <td>Type</td>
                    <td>
                        <select class='nonpersistent'
                            data-attribute='type'>
                            <option value='integmanual'>Integmanual</option>
                            <option value='procedures'>Procedures</option>
                            <option value='teamdecree'>Team Decree</option>
                            <option value='workinstr'>Work Instruction</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>Doc. Name</td>
                    <td>
                        <input type='text'
                            class='nonpersistent'
                            data-attribute='doctypename'>
                    </td>
                </tr>

                
            </table>
        </div>

        <!-- RIGHT COLUMN -->
        <div style='width:50%;'>
            <table style='width:100%; border-collapse:collapse;'>
                <tr>
                    <td>Description</td>
                    <td>
                        <input type='text'
                            class='nonpersistent'
                            data-attribute='description'>
                    </td>
                </tr>
                <tr>
                    <td style='width:30%;'>Remarks</td>
                    <td>
                        <input type='text'
                            class='nonpersistent'
                            data-attribute='remarks'>
                    </td>
                </tr>

                <tr>
                    <td>Enter By</td>
                    <td>
                        <input type='text'
                            class='nonpersistent'
                            data-attribute='enterby'
                            data-input='readonly'
                            disabled>
                    </td>
                </tr>
            </table>
        </div>

    </div>
</div>
