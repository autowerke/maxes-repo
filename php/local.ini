[PHP]
; --- PHP ERROR LOGGING ---
error_log = /var/www/html/php_error.log

; Perpanjang waktu eksekusi script (Default biasanya 30 atau 60)
; set 600 detik (10 menit) biar aman buat generate narasi panjang
max_execution_time = 3600

; Waktu maksimal untuk parse input data
max_input_time = 3600

; Waktu socket menunggu (penting buat cURL/file_get_contents)
default_socket_timeout = 3600

; Sembunyikan error dari layar (Biar JSON/HTML tidak rusak)
display_errors = Off
display_startup_errors = Off

; Tetap catat error di log (Biar bisa cek docker logs kalau butuh)
log_errors = On

; Matikan laporan untuk Deprecated, Notice, dan Warning
; Ini settingan "Damai" ala XAMPP
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT & ~E_NOTICE & ~E_WARNING

; AKTIFKAN BUFFERING (PENTING UNTUK SESSION/HEADER)
; Ini yang bikin error "Headers already sent" hilang
output_buffering = 4096

; Tweak performa standar
upload_max_filesize = 100M
post_max_size = 100M
date.timezone = Asia/Jakarta

; ====================================
; MAXES PERFORMANCE TUNING
; ====================================

; 1. Memory Limit
memory_limit = 1024M

; 2. OPCACHE (WAJIB)
; Menyimpan hasil kompilasi script PHP di RAM.
; Efek: PHP tidak perlu baca & compile file .php tiap kali request.
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=512
opcache.interned_strings_buffer=64
opcache.max_accelerated_files=50000
opcache.validate_timestamps=1
; Revalidate freq 0 artinya cek file berubah tiap request
; Kalau production, set ke 60
opcache.revalidate_freq=0

; 3. JIT (Just In Time Compiler - PHP 8 Fitur Baru)
; Bagus untuk kalkulasi matematika berat
opcache.jit_buffer_size=256M
opcache.jit=1255

; 4. Uploads
upload_max_filesize = 100M
post_max_size = 100M
; 5. Realpath Cache
; PHP sering bingung mapping path Windows vs Linux. Ini mempercepatnya.
realpath_cache_size = 16M
realpath_cache_ttl = 120


; REDIS SESSION HANDLER (BARU)
; Memindahkan penyimpanan session dari File ke Redis Server
; Efek: Login tidak hilang saat container restart & lebih cepat
session.save_handler = redis
session.save_path = "tcp://redis:6379"
