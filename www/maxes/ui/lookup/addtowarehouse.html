<div id="lookupentry" class="col-md-12">
	<div class="row">
		<div class="col-md-6">
			<table id='tbldata' width=100%>
				
				<tr>
					<td>Item </td>
					<td><input type='text' class='nonpersistent' data-childrentable='item' data-childrencolumn='itemnum' data-attribute='itemnum' data-type='upper' data-input='readonly' data-key='value'> </td>
					
				</tr>
				<tr>
					<td>Condition Type </td>
					<td><input type='text' data-attribute='conditiontype' data-lookup='itemcondition|itemnum'> </td>
				</tr>
				<tr>
					<td>Description </td>
					<td><input type='text' class='nonpersistent' data-attribute='description' data-input='readonly'> </td>
				</tr>
				<tr>
					<td colspan=2 class="maxes_sct_tbl4">Quantity</td>
				</tr>
				<tr>
					<td>Quantity </td>
					<td><input type='text' data-attribute='curbal' data-type='decimal' value='0.00' data-input='required'> </td>
				</tr>
				<tr>
					<td colspan=2 class="maxes_sct_tbl4">Issue Type</td>
				</tr>
				 <tr>
					<td> Type </td>
					<td><input type='text' class='nonpersistent' data-attribute='issuetype'  data-lookup='issuetype'> </td>
				</tr>
				<tr>
					<td> Unit Cost </td>
					<td><input type='text' data-attribute='unitcost' data-type='decimal' value='0.00' data-input='required'> </td>
				</tr>
				
			</table>
		</div>
		<div class="col-md-6">
			<table id='tbldata' width=100%>
				<tr>
					<td colspan=2 class="maxes_sct_tbl4">To Warehouse</td>
				</tr>
				<tr>
					<td>Warehouse </td>
					<td><input type='text' class='nonpersistent' data-attribute='warehouse' data-lookup='warehouse' data-key='value' data-input='required'> </td>
					
				</tr>
				 <tr>
					<td>Batch Num. </td>
					<td><input type='text' class='nonpersistent' data-attribute='batchnum'  data-key='value'> </td>
				</tr>
				<tr>
					<td>Rack </td>
					<td><input type='text' class='nonpersistent' data-attribute='racknum'> </td>
				</tr>
				<tr>
					<td>Company</td>
					<td> <input type='text' data-attribute='orgcode' data-input='readonly' data-key='value'> </td>
				</tr>
				<tr>
					<td colspan=2 class="maxes_sct_tbl4">Company</td>
				</tr>
				<tr>
					<td>Site </td>
					<td><input type='text ' data-attribute='sitecode' data-input='readonly' data-key='value'> </td>
				</tr>
				 
			</table>	
		</div>
	</div>
</div>
