<div id='createshipstatus'>
    <table id='lookupentry'>
        <tr>
            <td> Ship Via </td>
            <td>
                <input type='text' class='nonpersistent' data-attribute='shipvia'> </td>
            <td> Ship Agent </td>
            <td><input type='text' data-attribute='shipagent'> </td>
        </tr>
        <tr>
            <td> Shipment Date </td>
            <td>
                <input type='text' class='nonpersistent' data-attribute='shipdate' data-type='date'> </td>
            <td>Shipment Status </td>
            <td><input type='text' data-attribute='newshipstatus' data-lookup='shipstatus'>
            </td>
        </tr>
        <tr>
            <td> Est. Arrival </td>
            <td>
                <input type='text' class='nonpersistent' data-attribute='estdatearrival' data-type='date'> </td>
            <td> Longitude, Latitude </td>
            <td><input type='text' data-attribute='longlat'> </td>
        </tr>
        <tr>
            <td> Remarks</td>
            <td><input type='text' class='nonpersistent' data-attribute='remarks'> </td>
        </tr>
    </table>
</div>
