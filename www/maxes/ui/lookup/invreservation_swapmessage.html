<!-- CSS untuk Swap Map. Letakkan ini di dalam tag <style> atau file CSS lo -->
<style>
    /* ... (CSS modal utama tetap sama) ... */
    .swap-modal-body {
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 20px; /* Jarak antara mapping dan textarea */
    }

    /* --- Container Utama untuk Mapping --- */
    .swap-mapping-container {
        display: grid;
        grid-template-columns: 1fr auto 1fr; /* Kolom Requester, Kolom Panah, Kolom Target */
        gap: 15px;
        align-items: start;
        border: 1px solid #e9ecef;
        padding: 15px;
        border-radius: 8px;
        background-color: #f8f9fa;
    }

    /* --- Styling untuk Kolom Requester & Target --- */
    .swap-party {
        display: flex;
        flex-direction: column;
    }

    .swap-party h6 {
        margin: 0 0 10px 0;
        font-size: 0.9rem;
        color: #6c757d;
        text-transform: uppercase;
        border-bottom: 2px solid #dee2e6;
        padding-bottom: 5px;
    }

    /* --- List yang Bisa di-scroll --- */
    .swap-party-list {
        max-height: 200px; /* Batasi tinggi agar bisa di-scroll */
        overflow-y: auto;
        padding-right: 10px; /* Beri ruang untuk scrollbar */
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    /* --- Kartu Informasi untuk Setiap User --- */
    .swap-party-card {
        background-color: #ffffff;
        border: 1px solid #ced4da;
        border-radius: 5px;
        padding: 10px;
        font-size: 0.9rem;
    }

    .swap-party-card strong {
        display: block;
        color: #007bff; /* Biru untuk menyorot nama */
        margin-bottom: 4px;
    }

    .swap-party-card .info {
        font-size: 0.8rem;
        color: #495057;
    }

    /* --- Panah di Tengah --- */
    .swap-arrow {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        font-size: 2.5rem;
        color: #adb5bd;
	
    }
    
    .message-composer label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
    color: #343a40;
}

#negotiationMessageTextarea {
    width: 100%;           /* Lebar 100% */
    box-sizing: border-box; /* Yang paling penting! */
    min-height: 150px;
    padding: 10px;
    border: 1px solid #ced4da;
    border-radius: 4px;
    font-size: 1rem;
    resize: vertical;
}
</style>


<div class="swap-modal-content">
    <div class="swap-modal-header">
        <h4>Confirm & Compose Swap Request</h4>
    </div>
    <div class="swap-modal-body">
        
        <div class="swap-mapping-container">
            <div class="swap-party" id="requesters-column">
                <h6>FROM (Requesters / Needs)</h6>
                <div class="swap-party-list">
                    
                    <div class="swap-party-card">
                 
                    </div>
                 
                </div>
            </div>

            <!-- Panah Pemisah -->
            <div class="swap-arrow">
                <i class="fas fa-arrow-left"></i>
            </div>

          
            <div class="swap-party" id="targets-column">
                <h6>TO (Targets / Resources)</h6>
                <div class="swap-party-list">
                  
                    <div class="swap-party-card">
                       
                    </div>
                    
                </div>
            </div>
        </div>
        <div class="message-composer">
            <label for="negotiationMessageTextarea">Justification Message:</label>
			<br>
            <textarea id="negotiationMessageTextarea"></textarea>
        </div>
    </div>
   
</div>
