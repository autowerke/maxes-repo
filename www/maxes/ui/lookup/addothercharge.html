<div id = "lookupentry">
	<div class="col-md-12">
		<div class="maxes_sct_tbl4">
			Other Tax
		</div>
		<table id='tbldata'>
			
			<tr>	
				<td>Tax Code</td>
				<td><input type='text' class='nonpersistent' data-attribute='newtax' data-lookup="tax" data-lookupaction="y"></td>
			</tr>
			
			<tr>	
				<td>Tax(%)</td>
				<td><input type='text' class='nonpersistent' data-attribute='newtaxvalue' data-type='decimal'></td>
			</tr>
			
			<tr>	
				<td>Tax Cost</td>
				<td><input type='text' class='nonpersistent' data-attribute='newtaxcost' data-type='decimal' ></td>
			</tr>
		</table>	
	</div>
</div>
