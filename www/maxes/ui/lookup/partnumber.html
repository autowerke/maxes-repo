<table id='lookupentry'>
    <tr>
        <tr>
            <td> Item Number</td>
            <td>
                <input type='text' class='nonpersistent' data-attribute='itemnum' data-type='upper' data-key='value' data-lookup='item'> </td>
            <td> Country</td>
            <td>
                <input type='text' class='nonpersistent' data-attribute='country' data-type='upper' data-lookup='country'> </td>
        </tr>
        <tr>
            <td> Part Number</td>
            <td>
                <input type='text' class='nonpersistent' data-attribute='partnum' data-type='upper' data-key='value' data-input='required'> </td>
            <td>OEM</td>
            <td>
                <input type='text' class='nonpersistent' data-attribute='oem' data-type='upper' data-key='value'>
            </td>
        </tr>
        <tr>
            <td> Vendor</td>
            <td>
                <input type='text' class='nonpersistent' data-attribute='vendor' data-type='upper' data-key='value' data-lookup='vendor'> </td>
            <td>Manufacturer</td>
            <td>
                <input type='text' class='nonpersistent' data-attribute='manufacturer' data-type='upper' data-key='value' data-lookup='manufacturer'>
            </td>
        </tr>
</table>
