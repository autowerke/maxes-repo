<table id='lookupentry'>
	<tr>
		<td>Tax Code</td>
		<td>
			<input type='text' class='nonpersistent' data-attribute='taxcode' data-type='upper' data-key='value'>
		</td>
	</tr>
	<tr>
		<td>Description</td>
		<td>
			<input type='text' class='nonpersistent' data-attribute='description'>
		</td>
	</tr>
	<tr>
		<td>Value</td>
		<td>
			<input type='text' class='nonpersistent' data-attribute='value' data-type='decimal'>
		</td>
	</tr>
	<tr>
		<td>Tax Type</td>
		<td>
			<input type='text' class='nonpersistent' data-attribute='taxtype' data-lookup='taxtype'>
		</td>
	</tr>
</table>
