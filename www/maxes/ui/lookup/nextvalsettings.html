<div  id='lookupentry'>
	<div class="row">
	<div class="col-md-6">
		<table id='tbldata'>
			<tr>
				<td>Aplikasi</td>
				<td><input type='text' class='nonpersistent' data-attribute='app' data-type='upper' data-input='required' data-key='value' data-lookup='mxsapp'></td>
				
			</tr>
			<tr>
				<td>Awalan (Prefix)</td>
				<td><input type='text' class='nonpersistent' data-attribute='prefix' data-type='upper'></td>
				
			</tr>
			<tr>
				<td>Nilai Selanjutnya</td>
				<td><input type='text' class='nonpersistent' data-attribute='nextval' data-type='decimal'></td>
			</tr>
			<tr>
				<td>Untuk Primary Key?</td>
				<td><input type='checkbox' class='nonpersistent' data-attribute='isprimary'></td>
			</tr>
		</table>
	</div>
	<div class="col-md-6">
		<table id='tbldata'>
			<tr>
				<td>Kolom Primary Key</td>
				<td><input type='text' class='nonpersistent' data-attribute='keyattr' data-key='value' data-type='upper'></td>
			</tr>
			<tr>
				<td>Akhiran (Suffix)</td>
				<td><input type='text' class='nonpersistent' data-attribute='suffix' data-type='upper'></td>
			</tr>
			<tr>
				<td>Pad (berapa digit angka, <br>misalnya "001"= 3 digit)</td>
				<td><input type='text' class='nonpersistent' data-attribute='pad'></td>
			</tr>
			
		</table>
		</div>
	</div>
</div>
