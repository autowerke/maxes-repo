<style>
    /* Styling bisa menggunakan file CSS yang sama dengan Convert To Tool, karena strukturnya mirip */
    .convert-to-asset-modal * { box-sizing: border-box; }
    .convert-to-asset-modal { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; width: 100%; background-color: #ffffff; }
    .convert-to-asset-modal .modal-header { background-color: #f8f9fa; padding: 1rem 1.5rem; border-bottom: 1px solid #dee2e6; }
    .convert-to-asset-modal .modal-header h4 { margin: 0; font-size: 1.25rem; font-weight: 500; }
    .convert-to-asset-modal .modal-body { padding: 1.5rem; max-height: 60vh; overflow-y: auto; }
    .convert-to-asset-modal .modal-footer { background-color: #f8f9fa; padding: 1rem 1.5rem; text-align: right; border-top: 1px solid #dee2e6; }
    .convert-to-asset-modal .info-block { background-color: #e9ecef; padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1.5rem; font-size: 0.9rem; }
    .convert-to-asset-modal .info-block strong { color: #212529; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
    .form-control { width: 100%; padding: 0.65rem 0.75rem; font-size: 1rem; border: 1px solid #ced4da; border-radius: 6px; }
    .btn { font-weight: 600; cursor: pointer; border: 1px solid transparent; padding: 0.65rem 1.25rem; font-size: 1rem; border-radius: 6px; }
    .asset-input-table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    .asset-input-table th, .asset-input-table td { border: 1px solid #dee2e6; padding: 0.75rem; text-align: left; vertical-align: top; }
    .asset-input-table th { background-color: #f8f9fa; }
    .asset-input-table .form-control { padding: 0.375rem 0.75rem; }
    .asset-input-table .assetnum-readonly { background-color: #e9ecef; font-weight: bold; }
	.form-control.is-invalid { border-color: #dc3545; }
</style>

<div id="convertToAssetDialog" class="convert-to-asset-modal">

    <!-- DIALOG BODY -->	
    <div class="modal-body">
        
        <!-- Blok Informasi Statis -->
        <div class="info-block">
            <p class="mb-1"><strong>Item to Convert:</strong> <span id="modalItemNum">[ItemNum]</span> - <span id="modalItemDesc">[Description]</span></p>
            <p class="mb-1"><strong>From Location:</strong> <span id="modalLocation">[Location]</span></p>
            <p class="mb-0"><strong>Current Balance:</strong> <span id="modalBalance">[Balance]</span></p>
        </div>

        <!-- Form Input Kuantitas -->
        <div class="form-group row">
            <div class="col-md-4">
                <label for="quantityInput"><strong>Quantity to Convert:</strong></label>
                <input type="number" class="form-control" id="quantityInput" placeholder="Enter quantity..." min="1">
            </div>
            <div class="col-md-8 d-flex align-items-end">
                <button type="button" class="general-button" id="generateRowsButton">Generate Rows</button>
            </div>
        </div>

        <hr>

        <!-- Tabel untuk Input Detail Aset (Dibuat secara dinamis) -->
        <div id="assetDetailsContainer">
            <p><em>Please generate rows to enter asset details.</em></p>
            <table class="asset-input-table" style="display:none;">
                <thead>
                    <tr>
                        <th style="width: 20%;">Asset Num (Auto)</th>
                        <th style="width: 20%;">Serial Number*</th>
                        <th style="width: 30%;">Operational Location*</th>
                        <th style="width: 30%;">Parent Asset</th>
                    </tr>
                </thead>
                <tbody id="assetDetailsTbody">
                    <!-- Baris-baris input akan di-generate di sini -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- DIALOG FOOTER -->
    <div class="modal-footer">
        <button type="button" class="general-button" id="cancelConvertButton">Cancel</button>
        <button type="button" class="general-button" id="executeConvertButton" disabled>Convert</button>
    </div>
</div>
