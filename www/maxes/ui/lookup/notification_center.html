<div class="container-fluid">
	<div class="maxes01">
		<div class="row eatfix">
			<div class="col-md-12">
				<div class="notification-header">
					<div class="header-top">
						<div class="header-title-section">
							<div class="icon-wrapper">
								<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
									<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
									<path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
								</svg>
							</div>
							<div class="title-content">
								<h4 class="notification-title">Notification Center</h4>
								<p class="notification-subtitle">Manage and track your system notifications</p>
							</div>
						</div>
						<div class="header-actions">
							<button class="btn-mark-read" id="marknotif_allread" title="Mark all as read">
								<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
									<polyline points="20 6 9 17 4 12"></polyline>
								</svg>
								Mark All Read
							</button>
						</div>
					</div>
					<div class="header-filters">
						<div class="filter-group">
							<label class="filter-label">Show</label>
							<select class="filter-select entries-select">
								<option value="5">5</option>
								<option value="10">10</option>
								<option value="15">15</option>
								<option value="20">20</option>
							</select>
							<span class="filter-text">entries</span>
						</div>
						<div class="filter-group search-group">
							<div class="search-wrapper">
								<svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
									<circle cx="11" cy="11" r="8"></circle>
									<path d="m21 21-4.35-4.35"></path>
								</svg>
								<input type="text" class="filter-search" placeholder="Search notifications...">
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<div class="col-md-12">
			<table id="socialreservation" class="display" style="width:100% !important">
				<thead>
					<tr>
						<th>Num.</th>
						<th>Messages</th>
						<th>Process Name</th>
						<th>Doc. Num.</th>
						<th>Application</th>
						<th>Enter Date</th>
						<th>Action</th>
						<th>ID</th>
					</tr>
				</thead>
				<tbody>
					<!-- Data akan dimuat oleh DataTables -->
				</tbody>
			</table>
		</div>
	</div>
</div>
