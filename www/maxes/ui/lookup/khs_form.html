<style>
    /* -- Style untuk KHS Mini Form -- */

/* Container utama form menggunakan CSS Grid untuk layout 2 kolom */
.khs-form-container {
    display: grid;
    grid-template-columns: 1fr 1fr; /* Dua kolom dengan lebar yang sama */
    gap: 18px 16px; /* Jarak vertikal dan horizontal antar elemen */
    padding: 20px;
    background-color: #f9f9f9;
    border-radius: 8px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
}

/* Style umum untuk setiap grup input (label + field) */
.form-group {
    display: flex;
    flex-direction: column;
}

/* Class helper agar elemen bisa membentang selebar 2 kolom */
.form-span-2 {
    grid-column: span 2;
}

/* Style untuk semua label */
.form-group label {
    font-size: 14px;
    font-weight: 600;
    color: #333;
    margin-bottom: 6px;
}

/* Style umum untuk input text, number, dan textarea */
.form-group input[type="text"],
.form-group input[type="number"],
.form-group textarea {
    width: 100%;
    padding: 10px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box; /* Penting agar padding tidak menambah lebar */
    transition: border-color 0.2s, box-shadow 0.2s;
}

.form-group input:focus,
.form-group textarea:focus {
    outline: none;
    border-color: #007bff;
    box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25);
}

/* Style khusus untuk field yang read-only */
.form-group input[readonly] {
    background-color: #e9ecef;
    cursor: not-allowed;
    color: #555;
}

/* Style untuk radio button linetype */
.radio-group {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-top: 5px;
}

.radio-group label {
    font-weight: 500;
    margin-bottom: 0;
    margin-left: 5px;
    cursor: pointer;
}

.radio-group input[type="radio"] {
    cursor: pointer;
}

/* Style untuk field Service Item yang ada tombol lookup */
.input-with-button {
    display: flex;
    align-items: center;
}

.input-with-button input {
    border-top-right-radius: 0;
    border-bottom-right-radius: 0;
}

.lookup-btn {
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-left: none;
    background-color: #f0f0f0;
    cursor: pointer;
    border-top-right-radius: 6px;
    border-bottom-right-radius: 6px;
    transition: background-color 0.2s;
}

.lookup-btn:hover {
    background-color: #e0e0e0;
}

/* Style untuk field Total Biaya agar terlihat menonjol */
#linecost {
    font-weight: bold;
    font-size: 16px;
    color: #0056b3;
    background-color: #e9ecef; /* Sama seperti readonly */
}

/* Textarea untuk remarks */
.form-group textarea {
    resize: vertical; /* User bisa resize secara vertikal */
}

.error-field {
    border-color: #dc3545 !important;
    box-shadow: 0 0 0 2px rgba(220, 53, 69, 0.25) !important;
}

.error-message {
    color: #dc3545;
    font-size: 12px;
    margin-top: 4px;
    font-weight: 500;
}


</style>

<div id="lookupentry">

    <div class="khs-form-container">

    <!-- Baris 1: Pilihan Linetype (Driver Utama) -->
    <div class="form-group form-span-2">
        <label>Line Type</label>
        <div class="radio-group">
            <input type="radio" name="linetype" value="services" checked>
            <label for="linetype_service">Services</label>
            
            <input type="radio" name="linetype" value="material">
            <label for="linetype_material">Material</label>
        </div>
    </div>

    <!-- Baris 2: Service Item (Hanya tampil jika Linetype = 'services') -->
    <div id="service-item-field-group" class="form-group form-span-2">
        <label for="serviceitemnum">Service Item</label>
        <div class="input-with-button">
            <input type="text" data-attribute="khs_serviceitemnum" data-lookup="serviceitems" data-lookupaction="y">
        </div>
    </div>

    <!-- Baris 3: Deskripsi -->
    <div class="form-group form-span-2">
        <label for="description">Work Description</label>
        <input type="text" data-attribute="khs_description">
    </div>

    <!-- Baris 4: Kuantitas & Satuan (dibuat 2 kolom) -->
    <div class="form-group">
        <label for="quantity">Quantity</label>
        <input type="number" data-attribute="khs_quantity">
    </div>

    <div class="form-group">
        <label for="orderunit">Order Unit</label>
         <div class="input-with-button"> <input type="text" data-attribute="khs_orderunit" data-lookup="measureunit"> </div>
       
    </div>

    <div class="form-group">
        <label for="unitcost">Unit Cost</label>
        <input type="text" id="unitcost" data-attribute="unitcost" data-type="decimal">
    </div>
    <div class="form-group">
        <label for="linecost">Line Cost</label>
        <input type="text" id="linecost" data-attribute="linecost" class="readonly" readonly>
    </div>

     <div class="form-group">
        <label for="contractnum">Contract Num.</label>
        <input type="text" id="contractnum" data-attribute="contractnum" >
        <small>Contract Number if exist</small>
    </div>


    <!-- Baris 6: Keterangan / Remarks -->
    <div class="form-group form-span-2">
        <label for="remarks">Remarks</label>
        <textarea id="remarks" data-attribute="remarks" rows="3" placeholder="Enter additional notes if exist..."></textarea>
    </div>

</div>
</div>
