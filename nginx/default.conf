# --- BLOK 1: REDIRECT HTTP KE HTTPS ---
# Tugasnya cuma satu: Kalau ada user nyasar ke http://, lempar ke https://
server {
    listen 80 default_server; 
    server_name _;
    return 301 https://$host:9443$request_uri;
}

server {
    #listen 80;
    listen 443 ssl default_server;
    server_name _;

    # --- KONFIGURASI SSL (Wajib) ---
    # Lokasi ini sesuai dengan mapping volume di docker-compose
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # Protocol & Cipher yang aman
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

     # --- KONFIGURASI GLOBAL (Dari file lama kamu) ---
    client_max_body_size 100M;
    root /var/www/html;
    index index.php index.html;
    # --- TAMBAHAN TIMEOUT (Kasih 30 Menit / 1800 Detik) ---
    proxy_connect_timeout 3600;
    proxy_send_timeout 3600;
    proxy_read_timeout 3600;
    send_timeout 3600;
    
    # untuk PHP-FPM
    # Karena Nginx ngobrol sama PHP pakai FastCGI
    fastcgi_read_timeout 3600;
    fastcgi_send_timeout 3600;
    fastcgi_connect_timeout 3600;


    # 1. Routing Utama ke PHP (Maxes Web App)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 2. Routing ke Tomcat (BIRT Report)
    # Jika user akses: https://domain.com:9443/birt/maxtest/run?report=...
    # Nginx akan meneruskan ke: http://tomcat:8080/maxtest/run?report=...
    location /report/ {
        proxy_pass http://tomcat:8080/report/;
        
        # Header Standar Proxy
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 9443;
        
        # 1. PAKSA BROWSER UPGRADE HTTP -> HTTPS (Anti Mixed Content)
        add_header Content-Security-Policy "upgrade-insecure-requests";

        # 2. PAKSA GANTI TEKS URL YANG SALAH
        sub_filter_types *;
        sub_filter_once off;
        
        # Ganti localhost/internal IP -> IP Publik HTTPS
        sub_filter 'http://10.164.236.208:9090/' 'https://10.164.236.208:9443/';
        sub_filter 'http://localhost:8080' 'https://10.164.236.208:9443/';
        
        # Fix URL aneh (HTTP di port 443)
        sub_filter 'http://10.164.236.208:443/' 'https://10.164.236.208:9443/';

        proxy_redirect off;
    }
    # 3. Routing ke ML Engine (Swagger/API)
    # Jika user akses: http://domain.com/ai/docs
    # Nginx meneruskan ke: http://mlengine:8000/docs
    # location /ai/ {
    #    proxy_pass http://mlengine:8000/;
    #    proxy_set_header Host $host;
    #    proxy_set_header X-Real-IP $remote_addr;
    #}
	
	
	# Khusus untuk streaminig
	location ~ /run\.php$ {
		fastcgi_pass php:9000;
		fastcgi_index index.php;
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

		# SSE: matikan buffering
		fastcgi_buffering off;
		fastcgi_read_timeout 300;
		chunked_transfer_encoding on;
	}
	
    # 5. Handler PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
         # Biar $_SERVER['HTTPS'] bernilai 'on'
        fastcgi_param HTTPS on;
    }
}