<table id='lookupentry'>
	<tr>
		<td>Role</td>
		<td>
			<input type='text' class='nonpersistent' data-attribute='mxsrole' data-type='upper' data-key='value' data-input='required'>
		</td>
		<td>Type </td>
		<td>
			<input type='text' data-lookupaction='y' class='nonpersistent' data-attribute='type' data-lookup='mxswfroletype'>
		</td>
	</tr>
	<tr>
		<td>Appl.</td>
		<td>
			<input type='text' class='nonpersistent' data-attribute='appname' data-lookup='mxsapp'>
		</td>
		<td>Value</td>
		<td>
			<input type='text' class='nonpersistent' data-attribute='value' data-lookup='mxsusers'>
		</td>
	</tr>
	<tr>
		<td>Email?</td>
		<td>
			<input type='checkbox' class='nonpersistent' data-attribute='isemail'>
		</td>
		<td> <span class='allfollow'>Follow Up Rule</span>
		</td>
		<td><span class='allfollow'><input type='text' class='nonpersistent' data-attribute='followuprule' data-lookup='followuprule'> </span>
		</td>
	</tr>
	<tr>
		<td>Broadcast?</td>
		<td>
			<input type='checkbox' class='nonpersistent' data-attribute='isbroadcast'>
		</td>
		<td>
			
		</td>
		<td></td>
	</tr>
</table>
