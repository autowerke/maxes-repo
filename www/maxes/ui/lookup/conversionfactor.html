<table id='lookupentry'>
	<tr>
		<td>From Measurement Unit</td>
		<td>
			<input type='text' class='nonpersistent' data-attribute='frommeasureunit' data-type='upper' data-input='required' data-key='value' data-lookup='measureunit'>
		</td>
	</tr>
	<tr>
		<td>To Measurement Unit</td>
		<td>
			<input type='text' class='nonpersistent' data-attribute='tomeasureunit' data-type='upper' data-input='required' data-key='value' data-lookup='measureunit'>
		</td>
	</tr>
	<tr>
		<td>Conversion</td>
		<td>
			<input type='text' class='nonpersistent' data-attribute='conversion' data-type='decimal' data-input='required'>
		</td>
	</tr>
	<tr>
		<td>Item</td>
		<td>
			<input type='text' data-attribute='itemnum' data-type='upper' data-lookup='item'>
		</td>
	</tr>
</table>
