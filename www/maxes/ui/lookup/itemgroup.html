
<div id="lookupentry" class="col-md-12">
	<div class="row">
		<div class="col-md-6">
			<table id='tbldata'>
				<tr>
					<td>Item Group</td>
					<td><input type='text' class='nonpersistent' data-attribute='groupname' data-type='upper' data-input='required' data-key='value'> </td>
				</tr>
				 <tr>
					<td>Description </td>
					<td><input type='text' class='nonpersistent' data-attribute='description'> </td>
				</tr>
				 <tr>
					<td>Account Code </td>
					<td><input type='text' class='nonpersistent' data-input='required' data-attribute='glaccount' data-lookup='glaccount|sitecode'> </td>
				</tr>
			</table>
		</div>
		<div class="col-md-6">
			<table id='tbldata'>
				 <tr>
					<td>Company</td>
					<td><input type='text' data-attribute='orgcode' data-input='reaodnly'> </td>
				</tr>
					<td>Site</td>
					<td><input type='text' data-attribute='sitecode' data-input='reaodnly'> </td>
				</tr>
			</table>
		</div>	
	</div>
</div>
