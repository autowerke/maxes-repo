<table id='lookupentry'>
	<tr>
		<td>Action</td>
		<td>
			<input type='text' class='nonpersistent' data-attribute='action' data-type='upper' data-key='value' data-input='required'>
		</td>
		<td>Type </td>
		<td>
			<input type='text' class='nonpersistent' data-attribute='type' data-lookup='mxswfactiontype'>
		</td>
	</tr>
	<tr>
		<td>Application</td>
		<td>
			<input type='text' class='nonpersistent' data-attribute='appname' data-lookup='mxsapp'>
		</td>
		<td>Value</td>
		<td>
			<input type='text' class='nonpersistent' data-attribute='value'>
		</td>
	</tr>
</table>
