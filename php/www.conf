[www]
user = www-data
group = www-data
listen = 9000

; --- PROCESS MANAGER TUNING ---
; Default docker biasanya 'dynamic' dengan max_children=5.
; Dengan prosesor multi core bisa handle banyak request paralel.

pm = dynamic
pm.max_children = 50      ; Bisa melayani 50 request bersamaan
pm.start_servers = 10     ; Start awal langsung 10 pasukan
pm.min_spare_servers = 5
pm.max_spare_servers = 20
pm.max_requests = 1000    ; Restart worker setelah 1000 request (cegah memory leak)


; Terminasi request yang lebih lama dari 10 menit
request_terminate_timeout = 3600s
