<style>
    /* Styling dari file asli dipertahankan, hanya menambahkan sedikit penyesuaian jika perlu */
    .convert-to-tool-modal * {
        box-sizing: border-box;
    }

    .convert-to-tool-modal {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        width: 100%;
        background-color: #ffffff;
    }

    /* Header, Body, Footer di dalam konten */
    .convert-to-tool-modal .modal-header {
        background-color: #f8f9fa;
        padding: 1rem 1.5rem;
        border-bottom: 1px solid #dee2e6;
    }
    .convert-to-tool-modal .modal-header h4 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 500;
    }

    .convert-to-tool-modal .modal-body {
        padding: 1.5rem;
        max-height: 60vh; /* Batasi tinggi body agar bisa di-scroll */
        overflow-y: auto;
    }

    .convert-to-tool-modal .modal-footer {
        background-color: #f8f9fa;
        padding: 1rem 1.5rem;
        text-align: right;
        border-top: 1px solid #dee2e6;
    }

    .convert-to-tool-modal .info-block {
        background-color: #e9ecef;
        padding: 0.75rem 1rem;
        border-radius: 6px;
        margin-bottom: 1.5rem;
        font-size: 0.9rem;
    }
    .convert-to-tool-modal .info-block strong {
        color: #212529;
    }

    .form-group {
        margin-bottom: 1.25rem;
    }
    .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 0.5rem;
    }
    .form-control {
        width: 100%;
        padding: 0.65rem 0.75rem;
        font-size: 1rem;
        border: 1px solid #ced4da;
        border-radius: 6px;
    }
    
    .btn {
        font-weight: 600;
        cursor: pointer;
        border: 1px solid transparent;
        padding: 0.65rem 1.25rem;
        font-size: 1rem;
        border-radius: 6px;
    }

    /* Styling untuk tabel input tool */
    .tool-input-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1rem;
    }
    .tool-input-table th, .tool-input-table td {
        border: 1px solid #dee2e6;
        padding: 0.75rem;
        text-align: left;
    }
    .tool-input-table th {
        background-color: #f8f9fa;
    }
    .tool-input-table .form-control {
        padding: 0.375rem 0.75rem; /* Padding lebih kecil untuk input di dalam tabel */
    }
    .tool-input-table .toolnum-readonly {
        background-color: #e9ecef;
        font-weight: bold;
    }
	.form-control.is-invalid {
		border-color: #dc3545;
	}
</style>

<div id="convertToToolDialog" class="convert-to-tool-modal">

    <!-- DIALOG BODY -->	
    <div class="modal-body">
        
        <!-- Blok Informasi Statis (diisi oleh JavaScript saat dialog dibuka) -->
        <div class="info-block">
            <p class="mb-1"><strong>Item to Convert:</strong> <span id="modalItemNum">[ItemNum]</span> - <span id="modalItemDesc">[Description]</span></p>
            <p class="mb-1"><strong>From Location:</strong> <span id="modalLocation">[Location]</span></p>
            <p class="mb-0"><strong>Current Balance:</strong> <span id="modalBalance">[Balance]</span></p>
        </div>

        <!-- Form Input Kuantitas -->
        <div class="form-group row">
            <div class="col-md-4">
                <label for="quantityInput"><strong>Quantity to Convert:</strong></label>
                <input type="number" class="form-control" id="quantityInput" placeholder="Enter quantity..." min="1">
            </div>
            <div class="col-md-8 d-flex align-items-end">
                <button type="button" class="general-button" id="generateRowsButton">Generate Rows</button>
            </div>
        </div>

        <hr>

        <!-- Tabel untuk Input Detail Tool (akan dibuat secara dinamis oleh JavaScript) -->
        <div id="toolDetailsContainer">
            <p><em>Please generate rows to enter tool details.</em></p>
            <table class="tool-input-table" style="display:none;">
                <thead>
                    <tr>
                        <th>Tool Num (Auto)</th>
                        <th>Serial Number*</th>
                        <th>Asset Tag (Optional)</th>
                    </tr>
                </thead>
                <tbody id="toolDetailsTbody">
                    <!-- Baris-baris input akan di-generate di sini -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- DIALOG FOOTER -->
    <div class="modal-footer">
        <button type="button" class="general-button" id="cancelConvertButton">Cancel</button>
        <button type="button" class="general-button" id="executeConvertButton" disabled>Convert</button>
    </div>
</div>
