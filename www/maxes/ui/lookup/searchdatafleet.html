<div id="lookupentry" class="col-md-12">
	<div class="row">
		<div class="col-md-6">
			<input type ='radio' name='cari' value = 'pessangers' > Penumpang
			<input type ='radio' name='cari' value = 'package'> Paket
		</div>
	</div>
	<div class="row">
		<div class="col-md-6" id='searchpsgr'>
			<table width=100%>
				<tr>
					<td class="maxes_sct_tbl2">Cari Penumpang
					</td>
				</tr>
			</table>
			
			<table width=100%>
			<tr>
				<td>ID Transactions</td>
				<td>
					<input type='text' class='nonpersistent' data-attribute='transnum'>
				</td>
			</tr>
			
			<tr>
				<td>Name</td>
				<td>
					<input type='text' class='nonpersistent' data-attribute='fullname' >
				</td>
			</tr>
			<tr>
				<td>Phone</td>
				<td>
					<input type='text' class='nonpersistent' data-attribute='phone' >
				</td>
			</tr>
			<tr>
				<td>Date Berangkat</td>
				<td>
					<input type='text' class='nonpersistent' data-attribute='usagedate'  data-type='date'>
				</td>
			</tr>
			<tr>
				<td>Asal</td>
				<td><input type='text' class='nonpersistent' data-attribute='fromlocation' ></td>
				
			</tr>
			<tr>
				<td>Tujuan</td>
				<td><input type='text' class='nonpersistent' data-attribute='tolocation' ></td>
				
			</tr>
			</table>
	
		</div>
		<div class="col-md-6" id='searchpkg'>
			<table width=100%>
				<tr>
					<td class="maxes_sct_tbl2">Cari Paket
					</td>
				</tr>
			</table>
			
			<table width=100%>
			<tr>
				<td>ID Transactions/Resi</td>
				<td>
					<input type='text' class='nonpersistent' data-attribute='transnum'>
				</td>
			</tr>
			<tr>
				<td>Name Paket</td>
				<td>
					<input type='text' class='nonpersistent' data-attribute='packname'>
				</td>
			</tr>
			<tr>
				<td>Tanggal Kirim</td>
				<td>
					<input type='text' class='nonpersistent' data-attribute='dropdate' data-type='date'>
				</td>
			</tr>
			<tr>
				<td>Asal</td>
				<td>
					<input type='text' class='nonpersistent' data-attribute='fromlocation' >
				</td>
			</tr>
			<tr>
				<td>Tujuan</td>
				<td>
					<input type='text' class='nonpersistent' data-attribute='tolocation' >
				</td>
			</tr>
			</table>
			
			
		</div>
		
	</div>
</div>	
	
	
</table>
