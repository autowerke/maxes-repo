<table id='lookupentry'>
	<tr>
		<td>Group Name</td>
		<td>
			<input type='text' class='nonpersistent' data-input='required' data-attribute='groupname' data-lookup='itemgroup'>
		</td>
	</tr>
	<tr>
		<td>Sub Group Name</td>
		<td>
			<input type='text' class='nonpersistent' data-attribute='subgroupname' data-type='upper' data-input='required' data-key='value'>
		</td>
	</tr>
	<tr>
		<td>Description</td>
		<td>
			<input type='text' class='nonpersistent' data-attribute='description'>
		</td>
		
	</tr>
</table>
