<div  class='col-md-12'>
	<div class="row">
		<div class="col-md-6">
			<table class="tbldata" id='lookupentry'>
				<tr>
					<td colspan=2 class="maxes_sct_tbl4">Add New Parameter for Asset Productivity</td>						
				</tr>
				 <tr>
					<td>Parameter</td>
					<td> <input type='text' class='nonpersistent' data-attribute='assetparamnum' data-type='upper' data-key='value' data-input='required' >  </td>
				</tr>
				<tr>
					<td>Description</td>
					<td> <input type='text' class='nonpersistent' data-attribute='description'>  </td>
				</tr>
				<tr>
					<td>Measure Unit</td>
					<td> <input type='text' class='nonpersistent' data-attribute='measureunit' data-lookup="measureunit">  </td>
				</tr>
				<tr>
					<td>Sort Order</td>
					<td> <input type='text' class='nonpersistent' data-attribute='sortorder'>  </td>
				</tr>
				<tr>
					<td>Is Active?</td>
					<td> <input type='checkbox' class='nonpersistent' data-attribute='isactive'>  </td>
				</tr>
			</table>
		</div>
	</div>
	<div class="row">
		<div id='lookupentryTable'>
			<div class='tablelist'>
				<table id='mxtable_lookupEntry_prodparam' class='display' data-child='assetparam'></table>
			</div>
		</div>
	</div>
</div>
