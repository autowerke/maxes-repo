<div id="lookupentry" class="col-md-12">
	<div class="row">
		<div class="col-md-6">
			<table class="tbldata">
				<tr>
					<td>Item </td>
					<td><input type='text' class='nonpersistent' data-attribute='itemnum' data-input='readonly' data-key='value'> </td>
				</tr>
				
				<tr>
				<tr>
					<td>Description </td>
					<td> <input type='text' class='nonpersistent' data-attribute='itemnum.description' data-input='readonly'> </td>
				</tr>
				<tr>
					 <td>Warehouse </td>
					<td><input type='text' class='nonpersistent' data-attribute='warehouse' data-input='readonly'> </td>
				</tr>
			</table>
		</div>
		<div class="col-md-6">
			<table class="tbldata">
				<tr>
					<td>Company</td>
					<td><input type='text' data-attribute='orgcode' data-input='readonly'> </td>
				</tr>
					<td>Site</td>
					<td><input type='text' data-attribute='sitecode' data-input='readonly' data-key='value'></td>
				</tr>
				<tr>
				  <td>Update FIFO/LIFO ? </td>
					<td> <input type='checkbox' class='nonpersistent' data-attribute='synfifolifoqty'> </td>
				</tr>
				<tr>
				  <td colspan=2> <blockquote>If <b>Update FIFO/LIFO </b> is checked, then the stock or price in the FIFO/LIFO settings is also adjusted.</blockquote></td>
					
				</tr>
				
			</table>
		</div>
	</div>	
</div>
