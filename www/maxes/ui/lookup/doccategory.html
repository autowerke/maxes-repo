<div id='lookupentry'>

    <div style='display:flex; gap:20px; align-items:stretch;'>

        <!-- LEFT COLUMN -->
        <div style='width:50%;'>
            <table style='width:100%; border-collapse:collapse;'>

                <tr>
                    <td style='width:30%;'>Doc. Category Num</td>
                    <td>
                        <input type='text'
                            class='nonpersistent'
                            data-attribute='doccategorynum'
                            data-type='upper'
                            data-key='value'
                            data-input='required'>
                    </td>
                </tr>
                <tr>
                    <td>Doc. Category Name</td>
                    <td>
                        <input type='text'
                            class='nonpersistent'
                            data-attribute='doccategoryname'
                            data-type='upper'
                            data-input='required'>
                    </td>
                </tr>
                <tr>
                    <td>Category Code</td>
                    <td>
                        <input type='text'
                            class='nonpersistent'
                            data-attribute='categorycode'
                            data-type='upper'
                            data-input='required'>
                    </td>
                </tr>

            </table>
        </div>

        <!-- RIGHT COLUMN -->
        <div style='width:50%;'>
            <table style='width:100%; border-collapse:collapse;'>

                <tr>
                    <td style='width:30%;'>Description</td>
                    <td>
                        <input type='text'
                            class='nonpersistent'
                            data-attribute='description'>
                    </td>
                </tr>

                <tr>
                    <td>Remarks</td>
                    <td>
                        <input type='text'
                            class='nonpersistent'
                            data-attribute='remarks'>
                    </td>
                </tr>

                <tr>
                    <td>Enter By</td>
                    <td>
                        <input type='text'
                            class='nonpersistent'
                            data-attribute='enterby'
                            data-input='readonly'
                            disabled>
                    </td>
                </tr>

            </table>
        </div>

    </div>
</div>
