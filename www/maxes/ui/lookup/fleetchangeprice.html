<div id = "lookupentry">

			<tr>	
				<td>Ubah Harga(%)</td>

			<tr>	
				<td style="font-size:9pt; font-family:calibri"><br>

			</tr>
			<tr>
				<td><input type='checkbox' class='nonpersistent' data-attribute='roundup' checked></td>
				<td>Pembulatan</td>
			</tr>
		</table>	
	</div>
</div>
